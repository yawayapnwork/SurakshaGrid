name: SurakshaGrid CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surakshagrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/surakshagrid_test
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: test-secret-key-that-is-at-least-32-chars-long-for-jwt
      OSRM_BASE_URL: http://router.project-osrm.org
      ENVIRONMENT: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System GIS Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libgdal-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov httpx pytest-asyncio

      - name: Run Alembic Database Migrations
        run: |
          alembic upgrade head

      - name: Run Pytest with Coverage
        run: |
          pytest tests/ --cov=app --cov-report=term-missing

      - name: Seed Database State
        run: |
          python scripts/seed_db.py --force-reset

      - name: Start FastAPI Backend Service & Execute Smoke Test
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          # Wait for FastAPI server to initialize
          sleep 3
          python scripts/smoke_test.py --url http://127.0.0.1:8000

  frontend-check:
    name: Frontend Lint & Webpack Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
        run: npm run build

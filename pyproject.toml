[project]
name = "surakshagrid"
version = "0.1.0"
description = "SurakshaGrid flood response platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "geoalchemy2>=0.16,<0.17",
    "shapely>=2.0,<3.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "redis>=5.2,<6.0",
    "python-dotenv>=1.0,<2.0",
    "opencv-python-headless>=4.10,<5.1",
    "cloudinary>=1.40,<2.0",
    "pyjwt>=2.8,<3.0",
    "passlib[bcrypt]>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<1.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["scratch", ".venv"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


